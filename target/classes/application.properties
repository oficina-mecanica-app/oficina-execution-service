spring.application.name=oficina-execution-service
server.port=8082

# Conexão MongoDB
spring.data.mongodb.uri=mongodb://admin:admin_password@localhost:27017/oficina_execution?authSource=admin

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=admin_password

# ATENÇÃO: Remova todas as linhas de spring.jpa.* e spring.datasource.*
# O Mongo não usa Hibernate nem Datasource SQL.

# Security & JWT
api.security.token.secret=minha-chave-secreta-super-segura

# Observabilidade
# management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0

management.security.enabled=false
management.endpoints.web.exposure.include=*